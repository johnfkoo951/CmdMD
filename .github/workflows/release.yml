name: "Release"

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # 'true' once Developer ID signing secrets are configured; until then the
      # release ships ad-hoc signed (no notarization) exactly as before.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_NOTARY_APPLE_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the version check reads the previous release tag.
          fetch-depth: 0

      # Guard against version drift: the DMG name + bundle version come from
      # VERSION (package_app.sh writes them into Info.plist), not the tag. Fail
      # loudly if they disagree, or if CFBundleVersion did not go up since the
      # previous release tag.
      - name: Verify tag matches app version
        run: |
          version_value() { awk -F= -v key="$1" '$1 == key && !found++ { print substr($0, length(key) + 2) }'; }
          TAG_VER="${GITHUB_REF_NAME#v}"
          APP_VER="$(version_value CFBundleShortVersionString < VERSION)"
          APP_BUILD="$(version_value CFBundleVersion < VERSION)"
          echo "tag=$TAG_VER  VERSION=$APP_VER ($APP_BUILD)"
          if [ "$TAG_VER" != "$APP_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $APP_VER in VERSION — bump it before tagging."
            exit 1
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            if git cat-file -e "$PREV_TAG:VERSION" 2>/dev/null; then
              PREV_BUILD="$(git show "$PREV_TAG:VERSION" | version_value CFBundleVersion)"
            else
              # Releases before VERSION existed kept the build number in package_app.sh.
              PREV_BUILD="$(git show "$PREV_TAG:scripts/package_app.sh" \
                | awk '/<key>CFBundleVersion<\/key>/ && !found++ { getline; gsub(/[^0-9]/, ""); print }')"
            fi
            echo "previous release $PREV_TAG: build ${PREV_BUILD:-unknown}"
            if [ -n "$PREV_BUILD" ] && [ "$APP_BUILD" -le "$PREV_BUILD" ]; then
              echo "::error::CFBundleVersion $APP_BUILD in VERSION must be greater than $PREV_TAG's ($PREV_BUILD) — bump it before tagging."
              exit 1
            fi
          fi

      # ci.yml runs on the same commit in parallel and cannot block this job, so
      # the release gates itself: a failing test never gets packaged or published.
      # --force-resolved-versions builds exactly the committed Package.resolved
      # pins and fails if the lockfile is stale.
      - name: Run Tests
        run: swift test --force-resolved-versions

      - name: Package and Validate App Bundle
        run: scripts/test_package_app.sh

      # Ad-hoc path (no signing secrets): just build the DMG.
      - name: Build DMG (ad-hoc)
        if: env.HAS_SIGNING != 'true'
        run: scripts/make_dmg.sh

      # Notarized path (signing secrets present): Developer ID sign + notarize +
      # staple, rebuilding both the zip and DMG from the signed/stapled app.
      - name: Sign, notarize & staple (Developer ID)
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: scripts/sign_and_notarize.sh

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 CmdMD-macos.zip CmdMD-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CmdMD-macos.zip
            dist/CmdMD-*.dmg
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
