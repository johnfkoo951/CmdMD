name: "CI - Build & Test"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    # Use the runner's native Swift toolchain (matches the release workflow).
    # The pinned swift-actions/setup-swift @ 5.9 crashed building Yams' module
    # interface; the modern runner toolchain builds the package cleanly.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # --force-resolved-versions: build exactly the committed Package.resolved
      # pins, and fail (instead of silently re-resolving) if it is stale.
      - name: Build (Debug)
        run: swift build --force-resolved-versions

      - name: Build (Release)
        run: swift build --configuration release

      - name: Run Tests
        run: swift test

      # Exercise packaging on every push/PR too, so a broken package_app.sh or a
      # missing resource bundle fails here instead of at tag time.
      - name: Package and Validate App Bundle
        run: scripts/test_package_app.sh
